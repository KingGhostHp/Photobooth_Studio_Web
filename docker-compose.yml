services:
  postgres:
    image: postgres:16-alpine
    container_name: aura-studio-db
    environment:
      - POSTGRES_USER=aura_admin
      - POSTGRES_PASSWORD=aura_password_2026
      - POSTGRES_DB=aura_studio_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: always
    networks:
      - aura-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: aura-studio-backend
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - NODE_ENV=production
      - DATABASE_URL=postgresql://aura_admin:aura_password_2026@postgres:5432/aura_studio_db
    depends_on:
      - postgres
    restart: always
    networks:
      - aura-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: aura-studio-frontend
    ports:
      - "80:80"
    depends_on:
      - backend
    restart: always
    networks:
      - aura-network

networks:
  aura-network:
    driver: bridge

volumes:
  postgres_data:
